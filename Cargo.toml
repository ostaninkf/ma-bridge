[package]
name = "soundya"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "Alice voice bridge for Yandex Station: Music Assistant + SoundCloud (fork of rodyatotu/soundya)"
publish = false

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4"] }
# The same root certificates ureq uses, for the «обход блокировок» TLS connector (bypass.rs).
webpki-roots = "0.26"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
